    <script type="text/javascript">
        window.onload = function () {
            const contactForm = document.getElementById('contact-form');
            if (contactForm) {
                const emailSentMessage = document.querySelector('.email-sent');
                const emailFailedMessage = document.querySelector('.email-failed');
                const recaptchaError = document.querySelector('.recaptcha-error');
                const recaptchaContainer = document.getElementById('recaptcha-form-group');

                if (recaptchaContainer) {
                    recaptchaContainer.style.display = 'none';
                }

                contactForm.addEventListener('submit', function (event) {
                    event.preventDefault();

                    if (recaptchaContainer && recaptchaContainer.style.display === 'none') {
                        recaptchaContainer.style.display = 'block';
                        return;
                    }

                    var recaptchaResponse = grecaptcha.getResponse();
                    if (recaptchaResponse.length === 0) {
                        if(recaptchaError) recaptchaError.style.display = 'block';
                        if(emailSentMessage) emailSentMessage.style.display = 'none';
                        if(emailFailedMessage) emailFailedMessage.style.display = 'none';
                        return;
                    }
                    
                    if(recaptchaError) recaptchaError.style.display = 'none';

                    // these IDs from the previous steps
                    emailjs.sendForm('service_plspld5', 'template_r11i3hb', this)
                        .then(function () {
                            if(emailSentMessage) emailSentMessage.style.display = 'block';
                            if(emailFailedMessage) emailFailedMessage.style.display = 'none';
                            contactForm.reset();
                            grecaptcha.reset();
                        }, function (error) {
                            console.log('Email FAILED...', error);
                            if(emailFailedMessage) emailFailedMessage.style.display = 'block';
                            if(emailSentMessage) emailSentMessage.style.display = 'none';
                        });
                });
            }
        }
    </script>

<script>
  // Wait until the DOM is fully loaded
  document.addEventListener("DOMContentLoaded", function () {
    // Function to remove the Elfsight banner
    function removeElfsightBanner() {
      // Select the banner by its href attribute (unique to the Elfsight advert)
      const banner = document.querySelector('a[href*="elfsight.com/instagram-feed-instashow"]');
      if (banner) {
        banner.remove();
      }
    }

    // Run once in case the banner is already present
    removeElfsightBanner();

    // Set up a MutationObserver to watch for new nodes being added
    const observer = new MutationObserver(function (mutationsList) {
      for (const mutation of mutationsList) {
        if (mutation.type === 'childList') {
          removeElfsightBanner();
        }
      }
    });

    // Observe the entire document body for changes
    observer.observe(document.body, { childList: true, subtree: true });
  });
</script>
